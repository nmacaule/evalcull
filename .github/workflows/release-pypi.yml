name: release-pypi

# Publishes the Python package through PyPI trusted publishing (OIDC): no token anywhere.
# Runs on a version tag, or by hand (workflow_dispatch). Uses the GitHub environment "pypi";
# give it a required reviewer so every publish waits for a human approval.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_LINT_TERMS: ${{ secrets.CONTENT_LINT_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist python
      - name: Content lint on the exact artifacts that will be published
        run: |
          test -n "$CONTENT_LINT_TERMS" || { echo "CONTENT_LINT_TERMS secret is not set"; exit 1; }
          chmod +x scripts/content-lint
          for f in dist/*.whl; do scripts/content-lint archive "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI (trusted publishing; attestations are generated by the action)
        uses: pypa/gh-action-pypi-publish@release/v1
