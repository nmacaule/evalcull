name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # WP 7c (owner, 7 Nov 2026): WebKit and Firefox run the single-file, kept-bytes,
      # compare-loop and keyboard-loop specs on every runner; the Chromium suite stays on Linux
      - name: Install Playwright (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Install Playwright WebKit and Firefox (macOS, Windows)
        if: runner.os != 'Linux'
        run: npx playwright install --with-deps webkit firefox

      - name: Single-file build
        run: npm run build:single

      - name: E2E tests, Chromium, WebKit and Firefox (Linux)
        if: runner.os == 'Linux'
        run: npm run e2e

      - name: E2E tests, WebKit and Firefox (macOS, Windows)
        if: runner.os != 'Linux'
        run: npm run e2e -- --project=webkit --project=firefox
