name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Single-file build (Linux only)
        if: runner.os == 'Linux'
        run: npm run build:single

      - name: E2E tests (Linux only)
        if: runner.os == 'Linux'
        run: npm run e2e
